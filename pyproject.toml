[tool.ruff]
line-length = 130
target-version = "py310"
extend-exclude = ["app/static"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E731"]  # openapi.py uses small lambda helpers

[tool.ruff.lint.per-file-ignores]
"app/openapi.py" = ["E501"]  # dense spec literals read better on one line
"tests/*" = ["E501"]
