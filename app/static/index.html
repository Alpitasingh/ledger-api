<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ledger Console</title>
<style>
:root{--bg:#f3f3f3;--card:#fff;--ink:#242424;--mute:#616161;--line:#e0e0e0;--brand:#0f6cbd;--on:#fff;--ok:#107c10;--bad:#c50f1f;--okbg:#e7f3e7;--badbg:#fdeaec;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#1a1a1a;--card:#262626;--ink:#f5f5f5;--mute:#adadad;--line:#3a3a3a;--brand:#479ef5;--on:#0a0a0a;--ok:#6ccb6c;--bad:#f1707b;--okbg:#1c3a1c;--badbg:#4a1c21;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 "Segoe UI Variable","Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
header{display:flex;align-items:center;gap:10px;padding:14px 24px;background:var(--card);border-bottom:1px solid var(--line)}
.logo{width:26px;height:26px;border-radius:6px;background:linear-gradient(135deg,#0f6cbd,#2ea3f2);display:grid;grid-template-columns:1fr 1fr;gap:2px;padding:5px}
.logo i{background:#fff;border-radius:1px;opacity:.95}
header b{font-size:16px;font-weight:600}header span{color:var(--mute)}
main{display:grid;grid-template-columns:300px 1fr;gap:16px;padding:16px 24px;max-width:1200px;margin:auto}
@media(max-width:820px){main{grid-template-columns:1fr;padding:12px}}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.stack{display:grid;gap:16px;align-content:start}
h2{font-size:13px;font-weight:600;margin:0 0 10px;color:var(--mute);text-transform:uppercase;letter-spacing:.04em}
label{display:grid;gap:4px;font-size:12px;color:var(--mute)}
input,select,button{font:inherit;color:inherit}
input,select{padding:7px 10px;border:1px solid var(--line);border-radius:4px;background:var(--card);width:100%}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--brand);outline-offset:1px}
button{padding:7px 14px;border:1px solid var(--line);border-radius:4px;background:var(--card);cursor:pointer}
button.p{background:var(--brand);color:var(--on);border-color:var(--brand);font-weight:600}
button:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:8px;align-items:end;flex-wrap:wrap}.row>*{flex:1;min-width:110px}.row>button{flex:0 0 auto}
.acc{display:flex;justify-content:space-between;gap:8px;padding:9px 10px;border-radius:6px;cursor:pointer;border:1px solid transparent}
.acc:hover{background:var(--bg)}.acc.on{border-color:var(--brand);background:var(--bg)}
.acc small{display:block;color:var(--mute);font-size:11px}.acc strong{font-variant-numeric:tabular-nums}
.bal{font-size:34px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.id{color:var(--mute);font-size:12px;font-family:ui-monospace,Consolas,monospace}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media(max-width:820px){.grid2{grid-template-columns:1fr}}
table{width:100%;border-collapse:collapse}th{text-align:left;font-size:12px;color:var(--mute);font-weight:600}
th,td{padding:8px 6px;border-bottom:1px solid var(--line)}td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.pill{padding:2px 8px;border-radius:10px;font-size:12px;font-weight:600}
.credit{background:var(--okbg);color:var(--ok)}.debit{background:var(--badbg);color:var(--bad)}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:10px;color:var(--mute);flex-wrap:wrap}
.empty{padding:28px;text-align:center;color:var(--mute)}
#toast{position:fixed;right:16px;bottom:16px;max-width:380px;padding:12px 14px;border-radius:6px;background:var(--ink);color:var(--bg);box-shadow:0 8px 24px rgba(0,0,0,.3);display:none}
#toast.err{background:var(--bad);color:#fff}
</style>
</head>
<body>
<header><div class="logo" aria-hidden="true"><i></i><i></i><i></i><i></i></div><b>Ledger Console</b><span>Transaction Ledger API</span></header>
<main>
  <aside class="stack">
    <form class="card" id="newAcc"><h2>New account</h2>
      <div class="row"><label>Name<input id="accName" required maxlength="100" placeholder="e.g. Alice"></label><button class="p">Create</button></div>
    </form>
    <div class="card"><h2>Accounts</h2><div id="list"></div></div>
  </aside>
  <section class="stack" id="view"></section>
</main>
<div id="toast" role="status"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=n=>Number(n).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
const ref=p=>p+"-"+Math.random().toString(36).slice(2,8);
let accts=[],cur=null,page=1,type="";

async function api(path,opt={}){
  const r=await fetch(path,{method:opt.method||"GET",headers:{"Content-Type":"application/json"},body:opt.body?JSON.stringify(opt.body):undefined});
  const j=await r.json().catch(()=>({}));
  if(!r.ok){const e=j.error||{};const d=(e.details||[]).map(x=>x.field+" "+x.message).join("; ");
    throw new Error((e.code||r.status)+": "+(e.message||"Request failed")+(d?" ("+d+")":""));}
  return j;
}
let tt;function toast(m,err){const t=$("#toast");t.textContent=m;t.className=err?"err":"";t.style.display="block";clearTimeout(tt);tt=setTimeout(()=>t.style.display="none",4500)}
const run=f=>async e=>{e.preventDefault();try{await f(e)}catch(x){toast(x.message,true)}};

async function refresh(){
  accts=(await api("/accounts?limit=100")).data.reverse();
  if(!accts.find(a=>a.id===cur))cur=accts[0]?.id||null;
  $("#list").innerHTML=accts.length?accts.map(a=>`<div class="acc ${a.id===cur?"on":""}" data-id="${a.id}"><div>${esc(a.name)}<small>${a.id.slice(0,8)}…</small></div><strong>${fmt(a.balance)}</strong></div>`).join(""):'<div class="empty">No accounts yet.</div>';
  await draw();
}

async function draw(){
  const v=$("#view"),a=accts.find(x=>x.id===cur);
  if(!a){v.innerHTML='<div class="card empty">Create an account to get started.</div>';return}
  const h=await api(`/accounts/${a.id}/transactions?page=${page}&limit=8${type?"&type="+type:""}`);
  const p=h.pagination,others=accts.filter(x=>x.id!==a.id);
  v.innerHTML=`
  <div class="card"><h2>${esc(a.name)}</h2><div class="bal">${fmt(a.balance)}</div><div class="id">${a.id}</div></div>
  <div class="grid2">
    <form class="card" id="txForm"><h2>New transaction</h2><div class="stack" style="gap:10px">
      <div class="row"><label>Type<select name="type"><option>credit</option><option>debit</option></select></label><label>Amount<input name="amount" type="number" step="0.01" min="0.01" required></label></div>
      <label>Reference ID<input name="reference_id" value="${ref("tx")}" required></label>
      <label>Description<input name="description" maxlength="255" placeholder="optional"></label>
      <button class="p">Post transaction</button></div></form>
    <form class="card" id="trForm"><h2>Transfer</h2><div class="stack" style="gap:10px">
      <label>To account<select name="to" ${others.length?"":"disabled"}>${others.map(o=>`<option value="${o.id}">${esc(o.name)} (${fmt(o.balance)})</option>`).join("")||"<option>Create a second account</option>"}</select></label>
      <label>Amount<input name="amount" type="number" step="0.01" min="0.01" required></label>
      <label>Reference ID<input name="reference_id" value="${ref("xfer")}" required></label>
      <button class="p" ${others.length?"":"disabled"}>Send transfer</button></div></form>
  </div>
  <div class="card"><div class="row" style="justify-content:space-between;align-items:center"><h2 style="margin:0">History</h2>
    <label style="flex:0 0 150px"><select id="flt"><option value="">All types</option><option ${type==="credit"?"selected":""}>credit</option><option ${type==="debit"?"selected":""}>debit</option></select></label></div>
    ${h.data.length?`<table><thead><tr><th>Date</th><th>Description</th><th>Reference</th><th>Type</th><th class="n">Amount</th></tr></thead><tbody>${h.data.map(t=>`<tr><td>${new Date(t.created_at).toLocaleString()}</td><td>${esc(t.description||"-")}</td><td class="id">${esc(t.reference_id)}</td><td><span class="pill ${t.type}">${t.type}</span></td><td class="n">${t.type==="credit"?"+":"-"}${fmt(t.amount)}</td></tr>`).join("")}</tbody></table>`:'<div class="empty">No transactions.</div>'}
    <div class="bar"><span>${p.total_records} records · page ${p.page} of ${p.total_pages||1}</span><span><button id="prev" ${p.page<=1?"disabled":""}>Previous</button> <button id="next" ${p.page>=p.total_pages?"disabled":""}>Next</button></span></div></div>`;
  $("#txForm").onsubmit=run(async e=>{const f=Object.fromEntries(new FormData(e.target));
    await api(`/accounts/${a.id}/transactions`,{method:"POST",body:{type:f.type,amount:+f.amount,reference_id:f.reference_id,description:f.description}});
    page=1;toast("Transaction posted");await refresh()});
  $("#trForm").onsubmit=run(async e=>{const f=Object.fromEntries(new FormData(e.target));
    await api("/transfers",{method:"POST",body:{from_account_id:a.id,to_account_id:f.to,amount:+f.amount,reference_id:f.reference_id}});
    page=1;toast("Transfer complete");await refresh()});
  $("#flt").onchange=e=>{type=e.target.value;page=1;draw()};
  $("#prev").onclick=()=>{page--;draw()};$("#next").onclick=()=>{page++;draw()};
}

$("#list").onclick=e=>{const r=e.target.closest(".acc");if(r){cur=r.dataset.id;page=1;type="";refresh().catch(x=>toast(x.message,true))}};
$("#newAcc").onsubmit=run(async e=>{const a=await api("/accounts",{method:"POST",body:{name:$("#accName").value}});
  cur=a.id;e.target.reset();page=1;await refresh()});
refresh().catch(x=>toast(x.message,true));
</script>
</body>
</html>
